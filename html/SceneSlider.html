<div class="form-group background-volume-control bv-always-visible" data-module="background-volume" data-field="background-volume-slider" data-bv-protected="true" style="display: flex !important; flex-direction: row !important; visibility: visible !important; opacity: 1 !important; height: auto !important; max-height: none !important;">
    <label class="flexrow">{{label}}</label>
    <div class="form-fields">
        <input id="{{id}}" type="range" value="{{value}}" min="{{min}}" max="{{max}}" step="{{step}}" data-dtype="Number"/>
    </div>
    <p class="hint">{{hint}}</p>
</div>
